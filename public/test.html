<!DOCTYPE html>
<html>
<head><title>Test Flipscale</title></head>
<body style="font-family: sans-serif; padding: 40px;">
  <h2>🧪 Probador de transacciones</h2>
  
  <button onclick="probar()" style="padding: 15px 30px; font-size: 18px; background: #4ade80; border: none; border-radius: 8px; cursor: pointer;">
    Enviar prueba (24,5 € Vinted)
  </button>
  
  <pre id="resultado" style="margin-top: 20px; padding: 20px; background: #f3f4f6; border-radius: 8px;"></pre>
  
  <script>
    async function probar() {
      const r = await fetch('/api/transactions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer flipscale_test_1234',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          type: 'ingreso',
          category: 'vinted',
          amount: 24.5,
          note: 'Prueba desde el navegador'
        })
      });
      const data = await r.json();
      document.getElementById('resultado').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
